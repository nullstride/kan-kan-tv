name: Android build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - run: node tools/public-release-check.js
      - run: sh tools/test-playlist-inspect.sh
      - run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Bundle the exact corresponding source snapshot
        run: git archive --format=tar.gz --output=kankan-tv-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: kankan-tv-debug-with-sources
          path: |
            app/build/outputs/apk/debug/*.apk
            kankan-tv-source.tar.gz
