<div id="kk-settings-study">
  <div class="viz-carousel viz-dotted-background" aria-label="设置页三端概念示意" data-previous-label="上一端" data-next-label="下一端">
    <section data-variant="手机 · 横屏" aria-label="手机横屏设置概念" class="kk-stage">
      <div class="kk-device kk-phone" data-device="phone">
        <header><span>设置</span><span class="kk-draft" aria-live="polite">全部已保存</span><button type="button" data-cancel>取消</button><button type="button" class="kk-primary" data-save disabled>保存并应用</button></header>
        <div class="kk-layout"><nav aria-label="手机设置分类"></nav><main></main></div>
      </div>
    </section>
    <section data-variant="电视 · 遥控器" aria-label="电视设置概念" class="kk-stage" hidden>
      <div class="kk-device kk-tv" data-device="tv">
        <header><span class="kk-brand">看看电视</span><span>设置</span><span class="kk-draft" aria-live="polite">全部已保存</span></header>
        <div class="kk-layout"><nav aria-label="电视设置分类"></nav><main></main></div>
        <footer><span class="kk-keyhint">方向键移动 · OK 选择</span><button type="button" data-cancel>取消</button><button type="button" class="kk-primary" data-save disabled>保存并应用</button></footer>
      </div>
    </section>
    <section data-variant="Pad · 双栏" aria-label="Pad 设置概念" class="kk-stage" hidden>
      <div class="kk-device kk-pad" data-device="pad">
        <header><span class="kk-brand">看看电视</span><span>设置</span><span class="kk-draft" aria-live="polite">全部已保存</span></header>
        <div class="kk-layout"><nav aria-label="Pad 设置分类"></nav><main></main></div>
        <footer><span class="kk-keyhint">修改后统一应用</span><button type="button" data-cancel>取消</button><button type="button" class="kk-primary" data-save disabled>保存并应用</button></footer>
      </div>
    </section>
  </div>
</div>
<style>
#kk-settings-study {color-scheme:dark;--kk-canvas:#111113;--kk-surface:#1c1c1e;--kk-raised:#2c2c2e;--kk-label:#f5f5f7;--kk-secondary:#b8b8c0;--kk-line:#3b3b40;--kk-action:#f5f5f7;--kk-on-action:#1d1d1f;--kk-green:#30d158;--kk-blue:#80b8ff;--kk-amber:#ffd60a;--kk-red:#ff6961;--kk-radius:18px;font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--kk-label);}
#kk-settings-study * {box-sizing:border-box;}
#kk-settings-study .kk-stage {min-height:670px;padding:22px 6px 10px;display:flex;align-items:flex-start;justify-content:center;}
#kk-settings-study .kk-stage[hidden] {display:none;}
#kk-settings-study .kk-device {background:var(--kk-canvas);color:var(--kk-label);border:1px solid #5a5a60;border-radius:26px;overflow:hidden;width:100%;max-width:920px;box-shadow:0 16px 44px #00000040,inset 0 1px #ffffff18;font-size:16px;line-height:1.5;}
#kk-settings-study header {display:flex;align-items:center;gap:18px;min-height:76px;padding:18px 24px;background:linear-gradient(115deg,#ffffff0a,transparent 55%),#202023;border-bottom:1px solid var(--kk-line);box-shadow:inset 0 1px #ffffff14;font-weight:500;flex-wrap:wrap;}
#kk-settings-study .kk-brand {color:var(--kk-secondary);font-size:13px;font-weight:400;}
#kk-settings-study .kk-draft {margin-left:auto;color:var(--kk-secondary);font-size:13px;font-weight:400;display:inline-flex;align-items:center;gap:7px;}
#kk-settings-study .kk-draft[data-state="dirty"] {color:var(--kk-amber);}
#kk-settings-study .kk-draft[data-state="dirty"]:before {content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
#kk-settings-study .kk-draft[data-state="success"] {color:var(--kk-green);}
#kk-settings-study .kk-layout {display:grid;grid-template-columns:170px 1fr;min-height:430px;}
#kk-settings-study nav {padding:20px 12px;border-right:1px solid var(--kk-line);background:linear-gradient(155deg,#ffffff07,transparent 65%),#1b1b1e;}
#kk-settings-study button {font:inherit;border:0;border-radius:999px;background:var(--kk-raised);color:var(--kk-label);padding:10px 16px;min-height:48px;max-width:100%;white-space:normal;transition:background .17s,transform .17s,border-radius .2s;}
#kk-settings-study button:active {transform:scale(.98);}
#kk-settings-study button:disabled {opacity:1;background:#303034;color:#a0a0a8;box-shadow:none;}
#kk-settings-study button:not(:disabled):hover {filter:brightness(1.1);}
#kk-settings-study nav button {width:100%;text-align:left;margin-bottom:8px;border-radius:14px;background:transparent;color:var(--kk-secondary);display:flex;align-items:center;gap:9px;}
#kk-settings-study nav button svg {width:17px;height:17px;flex:none;}
#kk-settings-study nav button[aria-current="page"] {background:linear-gradient(#ffffff09,#ffffff00),#353538;color:var(--kk-label);box-shadow:inset 0 1px #ffffff12;font-weight:500;}
#kk-settings-study nav button[aria-current="page"] svg {color:var(--kk-blue);}
#kk-settings-study .kk-tv button:focus-visible {background:var(--kk-action);color:var(--kk-on-action);transform:scale(1.025);}
#kk-settings-study main {min-width:0;padding:26px;}
#kk-settings-study h2 {font-size:24px;line-height:1.3;font-weight:500;margin:0 0 6px;}
#kk-settings-study .kk-caption {color:var(--kk-secondary);font-size:14px;margin:0 0 20px;}
#kk-settings-study .kk-group {border-radius:var(--kk-radius);background:var(--kk-surface);overflow:hidden;margin:0 0 16px;box-shadow:0 0 0 1px #ffffff08;}
#kk-settings-study .kk-row {display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:14px 18px;border-bottom:1px solid var(--kk-line);font-size:16px;}
#kk-settings-study .kk-row:last-child {border-bottom:0;}
#kk-settings-study button.kk-row {width:100%;text-align:left;border-radius:0;background:var(--kk-surface);}
#kk-settings-study .kk-value {color:var(--kk-secondary);text-align:right;overflow-wrap:anywhere;}
#kk-settings-study .kk-primary {background:var(--kk-action);color:var(--kk-on-action);min-width:142px;box-shadow:inset 0 1px #fff,0 2px 8px #00000020;}
#kk-settings-study footer {display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:16px 24px;background:linear-gradient(115deg,#ffffff08,transparent),#202023;border-top:1px solid var(--kk-line);flex-wrap:wrap;}
#kk-settings-study .kk-keyhint {margin-right:auto;color:var(--kk-secondary);font-size:13px;}
#kk-settings-study label.kk-row {cursor:default;}
#kk-settings-study input[type="checkbox"] {appearance:none;width:48px;height:28px;min-width:48px;position:relative;border-radius:999px;background:var(--kk-raised);border:1px solid var(--kk-line);margin:0;transition:background .16s;}
#kk-settings-study input[type="checkbox"]:after {content:"";display:block;width:22px;height:22px;border-radius:50%;background:var(--kk-label);position:absolute;top:2px;left:2px;transition:transform .16s;}
#kk-settings-study input[type="checkbox"]:checked {background:var(--kk-green);}
#kk-settings-study input[type="checkbox"]:checked:after {transform:translateX(20px);background:#fff;}
#kk-settings-study input[type="checkbox"]:disabled {opacity:.45;}
#kk-settings-study .kk-note {font-size:14px;color:var(--kk-secondary);margin:12px 0;}
#kk-settings-study .kk-state {display:flex;align-items:center;gap:12px;min-height:54px;flex-wrap:wrap;}
#kk-settings-study .kk-morph {border-radius:999px;min-width:156px;background:#24364f;color:#bcd8ff;box-shadow:inset 0 1px #ffffff12;}
#kk-settings-study .kk-morph[data-phase="busy"] {border-radius:18px;background:#253b57;color:#c5ddff;}
#kk-settings-study .kk-morph[data-phase="done"] {background:#183d26;color:#96efad;}
#kk-settings-study [data-result][data-state="success"] {color:#96efad;}
#kk-settings-study [data-result][data-state="busy"] {color:#bcd8ff;}
#kk-settings-study .kk-pad {max-width:780px;}
#kk-settings-study .kk-phone {max-width:900px;border-radius:30px;}
#kk-settings-study .kk-phone .kk-layout {display:grid;grid-template-columns:136px minmax(0,1fr);min-height:300px;}
#kk-settings-study .kk-phone nav {border-right:1px solid var(--kk-line);border-bottom:0;padding:12px 10px;display:block;}
#kk-settings-study .kk-phone nav button {font-size:14px;padding:10px;margin:0 0 6px;text-align:left;}
#kk-settings-study .kk-phone main {padding:18px 22px;}
#kk-settings-study .kk-phone header {padding:10px 22px;min-height:68px;gap:12px;}
#kk-settings-study .kk-phone header button {font-size:14px;}
#kk-settings-study .kk-phone h2 {font-size:21px;}
#kk-settings-study .kk-phone .kk-caption {margin-bottom:12px;}
#kk-settings-study .kk-phone .kk-row {min-height:52px;padding:10px 16px;}
#kk-settings-study .kk-phone select {width:auto;max-width:65%;}
#kk-settings-study select,#kk-settings-study input[type="text"] {font:inherit;min-height:48px;width:100%;color:var(--kk-label);background:var(--kk-surface);border:1px solid var(--kk-line);border-radius:12px;padding:10px;}
#kk-settings-study select {background:var(--kk-raised);border-color:#505057;}
#kk-settings-study input[type="text"] {background:#151517;border-color:#505057;margin-top:8px;}
#kk-settings-study input[type="text"]:focus-visible {outline:2px solid var(--kk-blue);outline-offset:2px;}
#kk-settings-study details {margin:18px 0;}
#kk-settings-study summary {min-height:48px;padding:12px 0;color:var(--kk-blue);}
@media(max-width:560px){#kk-settings-study .kk-layout{display:block;}#kk-settings-study nav{display:flex;border-right:0;border-bottom:1px solid var(--kk-line);padding:10px;gap:4px;}#kk-settings-study nav button{margin:0;padding:8px;text-align:center;font-size:14px;}#kk-settings-study main{padding:20px 14px;}#kk-settings-study header{padding:16px;}#kk-settings-study .kk-brand{display:none;}#kk-settings-study .kk-keyhint{width:100%;}#kk-settings-study footer{padding:12px 16px;}#kk-settings-study .kk-stage{min-height:780px;}}
@media(max-width:540px){#kk-settings-study .kk-phone .kk-layout{display:block;}#kk-settings-study .kk-phone nav{display:flex;border-right:0;border-bottom:1px solid var(--kk-line);gap:4px;}#kk-settings-study .kk-phone nav button{margin:0;text-align:center;padding:8px;}#kk-settings-study .kk-phone main{padding:16px;}#kk-settings-study .kk-phone header{padding:10px 14px;}#kk-settings-study .kk-phone .kk-row:has(select){flex-direction:column;align-items:stretch;gap:8px;}#kk-settings-study .kk-phone select{width:100%;max-width:100%;}}
@media(max-width:560px){#kk-settings-study nav button{justify-content:center;min-width:0;}#kk-settings-study nav button svg{display:none;}}
@media(prefers-reduced-motion:reduce){#kk-settings-study *{transition:none!important;animation:none!important;}#kk-settings-study button:active,#kk-settings-study .kk-tv button:focus-visible{transform:none;}}
</style>
<script>
(()=>{
  const root=document.getElementById('kk-settings-study');
  const names=['网络连接','播放设置','频道管理'];
  const remembered=window.openai?.widgetState?.privateContent||{};
  root.querySelectorAll('[data-device]').forEach(device=>{
    const kind=device.dataset.device;
    const initial={core:'IjkMediaPlayer',h264:true,hevc:true,all:false,source:'北京移动 IPTV'};
    let draft={...initial,...remembered[kind]?.draft};let saved={...draft};let tab=remembered[kind]?.tab??1;let running=0;
    const main=device.querySelector('main');const nav=device.querySelector('nav');const status=device.querySelector('.kk-draft');const save=device.querySelector('[data-save]');
    function persist(){const all={};root.querySelectorAll('[data-device]').forEach(d=>{if(d._model)all[d.dataset.device]=d._model;});window.openai?.setWidgetState?.({modelContent:{concept:'设置页三端概念'},privateContent:all})?.catch(()=>{});}
    function update(){const dirty=JSON.stringify(draft)!==JSON.stringify(saved);status.textContent=dirty?'有修改 · 待应用':'全部已保存';status.dataset.state=dirty?'dirty':'saved';save.disabled=!dirty;device._model={tab,draft:{...draft}};}
    function rowSwitch(label,key){return '<label class="kk-row"><span>'+label+'</span><input type="checkbox" role="switch" aria-label="'+label+'" data-setting="'+key+'" '+(draft[key]?'checked':'')+'></label>';}
    function render(){
      nav.innerHTML=names.map((n,i)=>'<button type="button" class="cursor-interaction" data-tab="'+i+'" '+(i===tab?'aria-current="page"':'')+'><i data-lucide="'+['wifi','play','list-video'][i]+'" aria-hidden="true"></i><span>'+n+'</span></button>').join('');
      if(tab===0)main.innerHTML='<h2>网络连接</h2><p class="kk-caption">检测当前配置，修改后统一应用</p><div class="kk-group"><div class="kk-row"><span>节目源</span><span class="kk-value">'+draft.source+'</span></div><div class="kk-row"><span>连接方式</span><span class="kk-value">路由器代理</span></div></div><div class="kk-state"><button type="button" class="kk-morph" data-check>检测节目源</button><span class="kk-note" aria-live="polite" data-result>概念演示 · 无真实网络请求</span></div><details><summary>IPTV 连接设置（高级）</summary><label>代理地址<input type="text" value="192.168.2.1:8012" aria-label="代理地址" data-address></label></details>';
      if(tab===1)main.innerHTML='<h2>播放设置</h2><p class="kk-caption">画面、解码与声音</p><div class="kk-group"><label class="kk-row"><span>播放内核</span><select aria-label="播放内核" data-core>'+['IjkMediaPlayer','UTVPlayer','AndroidMediaPlayer'].map(n=>'<option '+(n===draft.core?'selected':'')+'>'+n+'</option>').join('')+'</select></label>'+rowSwitch('H.264 硬件解码','h264')+rowSwitch('HEVC / H.265 解码','hevc')+'</div><p class="kk-note">更改仅暂存，保存并应用后生效。</p>';
      if(tab===2)main.innerHTML='<h2>频道管理</h2><p class="kk-caption">节目来源与频道范围</p><div class="kk-group"><label class="kk-row"><span>节目源</span><select aria-label="节目源" data-source>'+['北京移动 IPTV','北京联通 IPTV','北京电信 IPTV'].map(n=>'<option '+(n===draft.source?'selected':'')+'>'+n+'</option>').join('')+'</select></label>'+rowSwitch('包含标清及历史频道','all')+'</div><p class="kk-note">节目数量不代表可播放数量。修改后请重新检测。</p>';
      if(tab===1&&draft.core==='AndroidMediaPlayer'){main.querySelectorAll('[data-setting="h264"],[data-setting="hevc"]').forEach(x=>{x.disabled=true;});main.querySelector('.kk-note').textContent='系统内核自行选择解码器，以上硬件解码选项不适用。';}
      if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});
      update();
    }
    nav.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;running++;tab=Number(b.dataset.tab);render();persist();});
    nav.addEventListener('keydown',e=>{if(kind!=='tv'||!['ArrowDown','ArrowUp'].includes(e.key))return;const buttons=Array.from(nav.querySelectorAll('button'));const i=buttons.indexOf(document.activeElement);if(i<0)return;e.preventDefault();buttons[Math.max(0,Math.min(buttons.length-1,i+(e.key==='ArrowDown'?1:-1)))].focus();});
    main.addEventListener('change',e=>{const x=e.target;if(x.dataset.setting)draft[x.dataset.setting]=x.checked;if(x.hasAttribute('data-core')){draft.core=x.value;render();}if(x.hasAttribute('data-source'))draft.source=x.value;if(x.hasAttribute('data-address'))draft.address=x.value;update();persist();});
    main.addEventListener('click',e=>{const button=e.target.closest('[data-check]');if(!button)return;const result=main.querySelector('[data-result]');if(button.dataset.phase==='busy'){running++;button.dataset.phase='idle';button.textContent='检测节目源';result.textContent='演示已取消';result.dataset.state='idle';return;}const run=++running;button.dataset.phase='busy';button.textContent='■ 取消检测';result.textContent='演示：正在抽查…';result.dataset.state='busy';setTimeout(()=>{if(run!==running)return;button.dataset.phase='done';button.textContent='✓ 检测完成';result.textContent='演示结果：收到媒体数据，尚未应用';result.dataset.state='success';},1700);});
    save.addEventListener('click',()=>{saved={...draft};update();status.textContent='✓ 设置已应用（演示）';status.dataset.state='success';persist();});
    device.querySelector('[data-cancel]').addEventListener('click',()=>{running++;draft={...saved};render();persist();});
    render();
  });
  if(globalThis.Tweak){const colors={surface:'#1c1c1e',link:'#80b8ff'};const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--kk-surface',colors.surface);root.style.setProperty('--kk-blue',colors.link);}});tweak.addColorPicker(colors,'surface',{label:'设置分组底色',reference:'--kk-surface'});tweak.addColorPicker(colors,'link',{label:'链接与图标',reference:'--kk-blue'});}
})();
</script>
